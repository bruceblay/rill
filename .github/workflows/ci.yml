name: Firmware and host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/test.py --sanitize
      - run: pio run
      - name: Compile host preview tools
        run: |
          mkdir -p build
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tools/render.cpp -o build/render
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tools/visual_preview.cpp -o build/visual_preview
          build/render build/smoke.wav 2 42 2
          build/visual_preview build/smoke.ppm 17 2
